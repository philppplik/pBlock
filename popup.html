<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/common.css">
  <script src="js/vendor/iconify-icon.min.js"></script>
  <style>
    body {
      width: 340px;
      min-height: 400px;
      padding: var(--space-lg);
    }

    .header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    .header img {
      max-width: 100%;
      height: auto;
    }

    .header p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .master-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-md) var(--space-lg);
      margin-bottom: var(--space-lg);
    }

    .master-toggle-label {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .master-toggle-label .icon {
      font-size: 20px;
    }

    .master-toggle-label .text {
      font-size: 14px;
      font-weight: 500;
    }

    .master-toggle-label .subtext {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .stats-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    .stats-card .count {
      font-size: 36px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stats-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: var(--space-xs);
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      margin-top: var(--space-md);
      padding-top: var(--space-md);
      border-top: 1px solid var(--border-color);
    }

    .stats-row .stat {
      text-align: center;
    }

    .stats-row .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .stats-row .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .level-switcher {
      display: flex;
      gap: var(--space-xs);
      margin-bottom: var(--space-lg);
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: var(--space-xs);
      border: 1px solid var(--border-color);
    }

    .level-btn {
      flex: 1;
      padding: var(--space-sm) var(--space-md);
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .level-btn:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    .level-btn.active {
      background: var(--accent-gradient);
      color: #fff;
    }

    .categories {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
    }

    .category-item:hover {
      border-color: var(--bg-hover);
    }

    .category-info {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .category-icon {
      font-size: 20px;
      width: 28px;
      text-align: center;
    }

    .category-name {
      font-size: 13px;
      font-weight: 500;
    }

    .category-count {
      font-size: 11px;
      color: var(--text-muted);
    }

    .subcategory-list {
      padding-left: 44px;
      display: none;
    }

    .subcategory-list.show {
      display: block;
    }

    .subcategory-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--border-color);
    }

    .subcategory-item:last-child {
      border-bottom: none;
    }

    .subcategory-name {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .subcategory-toggle .toggle {
      width: 36px;
      height: 20px;
    }

    .subcategory-toggle .toggle .slider::before {
      height: 14px;
      width: 14px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: var(--space-md);
      border-top: 1px solid var(--border-color);
    }

    .footer-link {
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .footer-link:hover {
      color: var(--accent-primary);
    }

    .disabled-overlay {
      opacity: 0.4;
      pointer-events: none;
    }

    .expand-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: var(--space-xs);
      font-size: 12px;
      transition: transform var(--transition-fast);
    }

    .expand-btn.rotated {
      transform: rotate(180deg);
    }

    /* Slider styles */
    .slider-section {
      margin-bottom: var(--space-lg);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-sm);
    }

    .slider-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .slider-value {
      font-size: 12px;
      font-weight: 600;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .slider-track {
      position: relative;
      width: 100%;
      height: 8px;
      background: var(--bg-tertiary);
      border-radius: 4px;
      margin-bottom: var(--space-sm);
    }

    .slider-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: transparent;
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      margin: 0;
    }

    .slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-gradient);
      cursor: pointer;
      border: 3px solid var(--bg-primary);
      box-shadow: 0 2px 8px rgba(229, 71, 72, 0.4);
    }

    .slider-input::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-gradient);
      cursor: pointer;
      border: 3px solid var(--bg-primary);
      box-shadow: 0 2px 8px rgba(229, 71, 72, 0.4);
    }

    .slider-steps {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }

    .slider-step {
      font-size: 9px;
      color: var(--text-muted);
      text-align: center;
      cursor: pointer;
    }

    .slider-step.active {
      color: var(--accent-primary);
      font-weight: 600;
    }

    .master-toggle-label .subtext {
      font-size: 11px;
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="images/pBlock-icon+schriftLogo.png" height="32" style="margin-bottom: 4px;">
    <p>v3.0.2 Red Bear</p>
  </div>

  <!-- Master Toggle -->
  <div class="master-toggle">
    <div class="master-toggle-label">
      <img src="images/pBlock-icon_Logo.png" width="28" height="28">
      <div>
        <div class="text">Schutz aktiv</div>
        <div class="subtext" id="activeRules">0 Regeln</div>
      </div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="masterToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Stats -->
  <div class="stats-card">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
      <div class="count" id="todayCount">0</div>
      <div id="liveIndicator" class="live-indicator" title="Live"></div>
    </div>
    <div class="label">Heute blockiert</div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-value" id="weekCount">0</div>
        <div class="stat-label">Woche</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Gesamt</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="bandwidthSaved">0 KB</div>
        <div class="stat-label">Gespart</div>
      </div>
    </div>
  </div>

  <!-- Category Breakdown -->
  <div class="category-breakdown" id="categoryBreakdown"></div>

  <!-- Level Switcher -->
  <div class="level-switcher">
    <button class="level-btn active" data-level="simple"><iconify-icon icon="hugeicons:user-02" style="color: #3fb950;"></iconify-icon> Laie</button>
    <button class="level-btn" data-level="expert"><iconify-icon icon="mdi:code-braces" style="color: #f85149;"></iconify-icon> Experte</button>
  </div>

  <!-- Simple Mode: Slider -->
  <div id="simpleModeSection" class="slider-section">
    <div class="slider-header">
      <span class="slider-label">Schutzniveau</span>
      <span class="slider-value" id="sliderLabel">Standard</span>
    </div>
    <div class="slider-track">
      <input type="range" class="slider-input" id="protectionSlider" min="0" max="100" step="25" value="50">
    </div>
    <div class="slider-steps">
      <span class="slider-step" data-value="0">Aus</span>
      <span class="slider-step" data-value="25">Minimal</span>
      <span class="slider-step active" data-value="50">Standard</span>
      <span class="slider-step" data-value="75">Hoch</span>
      <span class="slider-step" data-value="100">Max</span>
    </div>
  </div>

  <!-- Expert Mode: Categories -->
  <div id="expertModeSection" class="categories" style="display: none;">
    <!-- Dynamically filled -->
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="#" id="openOptions" class="footer-link"><iconify-icon icon="mdi:cog"></iconify-icon> Einstellungen</a>
    <a href="#" id="openPrivacy" class="footer-link"><iconify-icon icon="mdi:shield-lock-outline"></iconify-icon> Datenschutz</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
