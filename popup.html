<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/common.css">
  <script src="js/vendor/iconify-icon.min.js"></script>
  <style>
    body {
      width: 340px;
      min-height: 400px;
      padding: var(--space-lg);
      background: var(--bg-primary);
    }

    .header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    .header img {
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.2));
    }

    .header p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    /* Master Toggle - LP Glass */
    .master-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-md) var(--space-lg);
      margin-bottom: var(--space-lg);
      transition: all var(--transition-smooth);
    }

    .master-toggle:hover {
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
    }

    .master-toggle-label {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .master-toggle-label .icon {
      font-size: 20px;
    }

    .master-toggle-label .text {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .master-toggle-label .subtext {
      font-size: 11px;
      color: var(--accent-primary);
      font-weight: 500;
    }

    /* Stats Card - LP Glow */
    .stats-card {
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      text-align: center;
      margin-bottom: var(--space-lg);
      position: relative;
      overflow: hidden;
    }

    .stats-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .stats-card .count {
      font-size: 42px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
      text-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
    }

    .stats-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: var(--space-xs);
      letter-spacing: 0.02em;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      margin-top: var(--space-md);
      padding-top: var(--space-md);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stats-row .stat {
      text-align: center;
    }

    .stats-row .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .stats-row .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Level Switcher - LP Pill Style */
    .level-switcher {
      display: flex;
      gap: var(--space-xs);
      margin-bottom: var(--space-lg);
      background: rgba(15, 15, 15, 0.6);
      border-radius: var(--radius-full);
      padding: var(--space-xs);
      border: 1px solid var(--border-color);
    }

    .level-btn {
      flex: 1;
      padding: var(--space-sm) var(--space-md);
      border: none;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .level-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .level-btn.active {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: var(--accent-glow);
    }

    /* Categories */
    .categories {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md);
      background: rgba(15, 15, 15, 0.6);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      transition: all var(--transition-smooth);
    }

    .category-item:hover {
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(15, 15, 15, 0.8);
      transform: translateY(-1px);
    }

    .category-info {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .category-icon {
      font-size: 20px;
      width: 28px;
      text-align: center;
    }

    .category-name {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .category-count {
      font-size: 11px;
      color: var(--text-muted);
    }

    .subcategory-list {
      padding-left: 44px;
      display: none;
    }

    .subcategory-list.show {
      display: block;
    }

    .subcategory-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .subcategory-item:last-child {
      border-bottom: none;
    }

    .subcategory-name {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .subcategory-toggle .toggle {
      width: 36px;
      height: 20px;
    }

    .subcategory-toggle .toggle .slider::before {
      height: 14px;
      width: 14px;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: var(--space-md);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer-link {
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all var(--transition-smooth);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .footer-link:hover {
      color: var(--accent-primary);
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    .disabled-overlay {
      opacity: 0.4;
      pointer-events: none;
    }

    .expand-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: var(--space-xs);
      font-size: 12px;
      transition: all var(--transition-smooth);
    }

    .expand-btn:hover {
      color: var(--text-primary);
    }

    .expand-btn.rotated {
      transform: rotate(180deg);
    }

    /* Slider styles - LP Modern */
    .slider-section {
      margin-bottom: var(--space-lg);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-sm);
    }

    .slider-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .slider-value {
      font-size: 12px;
      font-weight: 600;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .slider-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-full);
      margin-bottom: var(--space-sm);
    }

    .slider-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: transparent;
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      margin: 0;
    }

    .slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-gradient);
      cursor: pointer;
      border: 3px solid var(--bg-primary);
      box-shadow: var(--accent-glow);
      transition: box-shadow var(--transition-smooth);
    }

    .slider-input::-webkit-slider-thumb:hover {
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    }

    .slider-input::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-gradient);
      cursor: pointer;
      border: 3px solid var(--bg-primary);
      box-shadow: var(--accent-glow);
    }

    .slider-steps {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }

    .slider-step {
      font-size: 9px;
      color: var(--text-muted);
      text-align: center;
      cursor: pointer;
      transition: color var(--transition-smooth);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .slider-step:hover {
      color: var(--text-secondary);
    }

    .slider-step.active {
      color: var(--accent-primary);
      font-weight: 600;
    }

    /* Element Rules Section - LP Glass */
    .element-rules-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 15, 15, 0.6);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-sm) var(--space-md);
      margin-bottom: var(--space-lg);
      transition: all var(--transition-smooth);
    }

    .element-rules-section:hover {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .element-rules-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .element-rules-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .element-rules-count {
      background: var(--accent-dim);
      color: var(--accent-primary);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .element-rules-manage {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      font-size: 11px;
      padding: 4px 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition-smooth);
    }

    .element-rules-manage:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="images/pBlock-icon+schriftLogo.png" height="32" style="margin-bottom: 4px;">
    <p>v4.0.0 Friendly Bird</p>
  </div>

  <!-- Master Toggle -->
  <div class="master-toggle">
    <div class="master-toggle-label">
      <img src="images/pBlock-icon_Logo.png" width="28" height="28">
      <div>
        <div class="text">Schutz aktiv</div>
        <div class="subtext" id="activeRules">0 Regeln</div>
      </div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="masterToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Stats -->
  <div class="stats-card">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
      <div class="count" id="todayCount">0</div>
      <div id="liveIndicator" class="live-indicator" title="Live"></div>
    </div>
    <div class="label">Heute blockiert</div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-value" id="weekCount">0</div>
        <div class="stat-label">Woche</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Gesamt</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="bandwidthSaved">0 KB</div>
        <div class="stat-label">Gespart</div>
      </div>
    </div>
  </div>

  <!-- Category Breakdown -->
  <div class="category-breakdown" id="categoryBreakdown"></div>

  <!-- Level Switcher -->
  <div class="level-switcher">
    <button class="level-btn active" data-level="simple"><iconify-icon icon="hugeicons:user-02" style="color: #3fb950;"></iconify-icon> Laie</button>
    <button class="level-btn" data-level="expert"><iconify-icon icon="mdi:code-braces" style="color: #f85149;"></iconify-icon> Experte</button>
  </div>

  <!-- Simple Mode: Slider -->
  <div id="simpleModeSection" class="slider-section">
    <div class="slider-header">
      <span class="slider-label">Schutzniveau</span>
      <span class="slider-value" id="sliderLabel">Standard</span>
    </div>
    <div class="slider-track">
      <input type="range" class="slider-input" id="protectionSlider" min="0" max="100" step="25" value="50">
    </div>
    <div class="slider-steps">
      <span class="slider-step" data-value="0">Aus</span>
      <span class="slider-step" data-value="25">Minimal</span>
      <span class="slider-step active" data-value="50">Standard</span>
      <span class="slider-step" data-value="75">Hoch</span>
      <span class="slider-step" data-value="100">Max</span>
    </div>
  </div>

  <!-- Expert Mode: Categories -->
  <div id="expertModeSection" class="categories" style="display: none;">
    <!-- Dynamically filled -->
  </div>

  <!-- Element Rules (Expert Mode) -->
  <div id="elementRulesSection" class="element-rules-section" style="display: none;">
    <div class="element-rules-header">
      <span class="element-rules-label">
        <iconify-icon icon="mdi:cursor-default-click" width="16" height="16"></iconify-icon>
        Element-Regeln
      </span>
      <span class="element-rules-count" id="elementRulesCount">0</span>
    </div>
    <button class="element-rules-manage" id="manageElementRules">
      Verwalten
    </button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="#" id="openOptions" class="footer-link"><iconify-icon icon="mdi:cog"></iconify-icon> Einstellungen</a>
    <a href="#" id="openPrivacy" class="footer-link"><iconify-icon icon="mdi:shield-lock-outline"></iconify-icon> Datenschutz</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
